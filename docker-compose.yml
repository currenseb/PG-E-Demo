services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    container_name: pge-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: substation
      CLICKHOUSE_USER: pge_app
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:12.1.1
    container_name: pge-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - clickhouse
    networks:
      - monitoring
  simulator:
    build: ./simulator
    container_name: pge-simulator
    restart: unless-stopped
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: pge_app
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DATABASE: substation
    depends_on:
      - clickhouse
    networks:
      - monitoring
  
  ngrok:
    image: ngrok/ngrok:latest
    container_name: pge-ngrok
    restart: unless-stopped
    command:
      - "http"
      - "grafana:3000"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    depends_on:
      - grafana
    networks:
      - monitoring

volumes:
  clickhouse_data:
  grafana_data:

networks:
  monitoring:
    driver: bridge
